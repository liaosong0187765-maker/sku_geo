[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-source-passport"
version = "0.1.0"
description = "Local-first Creator Source Passport MVP generator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
creator-passport = "creator_passport.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

