services:
  creator-passport:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app/src
    command: python -m creator_passport serve examples/source_passport.json --out generated/demo --host 0.0.0.0 --port 8765
    ports:
      - "8765:8765"

